<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280" fill="none">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
    <linearGradient id="code-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Ambient glow -->
  <circle cx="160" cy="140" r="110" fill="#3B82F6" fill-opacity="0.06" />

  <!-- Main Terminal Window -->
  <g filter="url(#soft-shadow)">
    <rect x="35" y="30" width="250" height="205" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Title bar -->
    <path d="M35 46C35 37.1634 42.1634 30 51 30H269C277.837 30 285 37.1634 285 46V65H35V46Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Traffic lights -->
    <circle cx="52" cy="48" r="4" fill="#EF4444" />
    <circle cx="64" cy="48" r="4" fill="#F59E0B" />
    <circle cx="76" cy="48" r="4" fill="#10B981" />
    <!-- Tab pill -->
    <rect x="95" y="40" width="80" height="18" rx="5" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="105" y="52" font-family="monospace" font-size="9" font-weight="600" fill="#334155">two_sum.py</text>
    <!-- O(n) badge -->
    <rect x="245" y="40" width="30" height="18" rx="4" fill="#ECFDF5" stroke="#A7F3D0" />
    <text x="251" y="52" font-family="monospace" font-size="8" font-weight="700" fill="#059669">O(n)</text>

    <!-- Code lines -->
    <!-- Line 1: def twoSum(nums, target): -->
    <text x="50" y="86" font-family="monospace" font-size="9" fill="#94A3B8">1</text>
    <text x="65" y="86" font-family="monospace" font-size="9" font-weight="600" fill="#7C3AED">def </text>
    <text x="88" y="86" font-family="monospace" font-size="9" font-weight="600" fill="#2563EB">twoSum</text>
    <text x="124" y="86" font-family="monospace" font-size="9" fill="#475569">(</text>
    <text x="130" y="86" font-family="monospace" font-size="9" fill="#D97706">nums</text>
    <text x="152" y="86" font-family="monospace" font-size="9" fill="#475569">, </text>
    <text x="162" y="86" font-family="monospace" font-size="9" fill="#D97706">target</text>
    <text x="195" y="86" font-family="monospace" font-size="9" fill="#475569">):</text>

    <!-- Line 2:   seen = {} -->
    <text x="50" y="104" font-family="monospace" font-size="9" fill="#94A3B8">2</text>
    <text x="75" y="104" font-family="monospace" font-size="9" fill="#334155">seen = {}</text>

    <!-- Line 3:   for i, n in enumerate(nums): -->
    <text x="50" y="122" font-family="monospace" font-size="9" fill="#94A3B8">3</text>
    <text x="75" y="122" font-family="monospace" font-size="9" font-weight="600" fill="#7C3AED">for </text>
    <text x="96" y="122" font-family="monospace" font-size="9" fill="#334155">i, n </text>
    <text x="120" y="122" font-family="monospace" font-size="9" font-weight="600" fill="#7C3AED">in </text>
    <text x="135" y="122" font-family="monospace" font-size="9" fill="#2563EB">enumerate</text>
    <text x="185" y="122" font-family="monospace" font-size="9" fill="#475569">(nums):</text>

    <!-- Line 4:     diff = target - n -->
    <text x="50" y="140" font-family="monospace" font-size="9" fill="#94A3B8">4</text>
    <text x="85" y="140" font-family="monospace" font-size="9" fill="#334155">diff = target - n</text>

    <!-- Line 5:     if diff in seen: -->
    <text x="50" y="158" font-family="monospace" font-size="9" fill="#94A3B8">5</text>
    <text x="85" y="158" font-family="monospace" font-size="9" font-weight="600" fill="#7C3AED">if </text>
    <text x="100" y="158" font-family="monospace" font-size="9" fill="#334155">diff in seen:</text>

    <!-- Line 6:       return [seen[diff], i] -->
    <text x="50" y="176" font-family="monospace" font-size="9" fill="#94A3B8">6</text>
    <text x="95" y="176" font-family="monospace" font-size="9" font-weight="600" fill="#7C3AED">return </text>
    <text x="135" y="176" font-family="monospace" font-size="9" font-weight="600" fill="#059669">[seen[diff], i]</text>

    <!-- Line 7:     seen[n] = i -->
    <text x="50" y="194" font-family="monospace" font-size="9" fill="#94A3B8">7</text>
    <text x="85" y="194" font-family="monospace" font-size="9" fill="#334155">seen[n] = i</text>

    <!-- Status bar footer -->
    <path d="M35 210H285V225C285 231.627 279.627 235 273 235H47C40.3726 235 35 231.627 35 225V210Z" fill="#F8FAFC" />
    <line x1="35" y1="210" x2="285" y2="210" stroke="#E2E8F0" />
    <text x="48" y="224" font-family="sans-serif" font-size="8" fill="#64748B">Python 3.11</text>
    <text x="235" y="224" font-family="sans-serif" font-size="8" font-weight="600" fill="#059669">Passed ✓</text>
  </g>

  <!-- Floating Badge: Code Symbol < / > (Top Left) -->
  <g filter="url(#card-shadow)">
    <rect x="18" y="15" width="40" height="40" rx="10" fill="url(#code-badge-grad)" />
    <path d="M34 28L28 35L34 42M42 28L48 35L42 42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Floating Badge: Google 4-Color (Top Right) -->
  <g filter="url(#card-shadow)">
    <rect x="255" y="15" width="44" height="44" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <g transform="translate(265, 25)">
      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" transform="scale(0.95)" />
      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" transform="scale(0.95)" />
      <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z" transform="scale(0.95)" />
      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" transform="scale(0.95)" />
    </g>
  </g>

  <!-- Floating Badge: Amazon (Mid Left) -->
  <g filter="url(#card-shadow)">
    <rect x="8" y="105" width="44" height="44" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path d="M22 133C27 136 33 134 35 132M33 130L36 132L34 135" stroke="#FF9900" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating Badge: Frequency mini-card (Mid Right) -->
  <g filter="url(#card-shadow)">
    <rect x="250" y="110" width="62" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="260" y="128" width="6" height="12" rx="2" fill="#10B981" />
    <rect x="270" y="120" width="6" height="20" rx="2" fill="#F59E0B" />
    <rect x="280" y="132" width="6" height="8" rx="2" fill="#EF4444" />
    <circle cx="295" cy="125" r="2.5" fill="#3B82F6" />
    <text x="260" y="148" font-family="sans-serif" font-size="7" font-weight="700" fill="#334155">Ranked</text>
  </g>

  <!-- Floating Badge: Apple (Bottom Left) -->
  <g filter="url(#card-shadow)">
    <rect x="18" y="200" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path fill="#0F172A" d="M37 222.5c-.5.8-1.1 1.6-1.9 1.6s-1.1-.5-2.1-.5-2.1.5-3.1.5-1.4-.8-2-1.6c-1.3-1.6-2.2-4.5-1.1-6.5.5-1 1.5-1.6 2.6-1.6.8 0 1.6.6 2.1.6s1.4-.7 2.4-.6c.4 0 1.6.2 2.3 1.3-.1 0-1.4.8-1.4 2.5 0 2 1.7 2.6 1.7 2.6-.2.7-.4 1.2-.6 1.7zm-1.8-8.5c.4-.5.7-1.2.6-1.9-.6 0-1.3.4-1.7.9-.4.4-.7 1.1-.6 1.8.7.1 1.3-.3 1.7-.8z" />
  </g>

  <!-- Floating Badge: Microsoft (Bottom Right) -->
  <g filter="url(#card-shadow)">
    <rect x="255" y="200" width="42" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="266" y="211" width="8" height="8" rx="1" fill="#F25022" />
    <rect x="277" y="211" width="8" height="8" rx="1" fill="#7FBA00" />
    <rect x="266" y="222" width="8" height="8" rx="1" fill="#00A4EF" />
    <rect x="277" y="222" width="8" height="8" rx="1" fill="#FFB900" />
  </g>
</svg>
